name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test on Ubuntu
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Lua 5.1
      uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: "5.1"
    
    - name: Setup Luarocks
      uses: leafo/gh-actions-luarocks@v4
    
    - name: Install luacheck
      run: luarocks install luacheck
    
    - name: Install stylua
      run: |
        curl -L https://github.com/JohnnyMorganz/StyLua/releases/download/v0.20.0/stylua-linux-x86_64.zip -o stylua.zip
        unzip stylua.zip
        chmod +x stylua
        sudo mv stylua /usr/local/bin/
    
    - name: Run linting and formatting check
      run: make check
    
    - name: Run build
      run: make build
    
    - name: Run all checks
      run: make all
    
    - name: Create release build
      run: make release
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gemi-nvim-release
        path: dist/
        retention-days: 30

  luajit-syntax-check:
    runs-on: ubuntu-latest
    name: LuaJIT Syntax Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install LuaJIT
      run: |
        sudo apt-get update
        sudo apt-get install -y luajit
    
    - name: Check Lua syntax with LuaJIT
      run: |
        echo "Checking Lua syntax with LuaJIT..."
        find lua -name "*.lua" -exec luajit -bl {} \; > /dev/null 2>&1 || (echo "Syntax check failed" && exit 1)
        find plugin -name "*.lua" -exec luajit -bl {} \; > /dev/null 2>&1 || (echo "Syntax check failed" && exit 1)
        echo "LuaJIT syntax check passed!"